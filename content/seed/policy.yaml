        en: "In 2025, 13,700 policies were terminated for non-payment."

  - slug: lapse-rate
    type: METRIC
    labels:
      lv: { preferred: "Polišu spēka zaudēšanas līmenis", alt: [], abbrev: [] }
      en: { preferred: "Lapse rate", alt: ["Non-payment lapse rate"], abbrev: [] }
    definition:
      lv: "Periodā spēku zaudējušo polišu skaita attiecība pret vidējo spēkā esošo polišu skaitu tajā pašā periodā."
      en: "The ratio of the number of policies lapsed in a period to the average number of policies in force in the same period."
    notes:
      lv: "Mēneša un gada vērtības nav tieši salīdzināmas; salīdzināšanai mēneša likmi annualizē. Rādītājs neietver neatjaunošanu (to mēra noturēšanas līmenis) un izbeigšanu pēc klienta pieprasījuma. Polises ar daļmaksājumiem parasti uzrāda augstāku līmeni."
      en: "Monthly and annual values are not directly comparable; annualise the monthly rate for comparison. The measure excludes non-renewal (measured by the retention rate) and cancellations at the customer's request. Policies paid in instalments usually show a higher rate."
    relations:
      - { type: RELATED, target: lapse }
      - { type: RELATED, target: retention-rate }
    tags: [kpi, retention, policy]
    metric:
      formula: "Lapsed policies count / Average policies in force count over the period"
      unit: PERCENT
      aggregation: RATIO
      additivity: NON_ADDITIVE
      polarity: LOWER_IS_BETTER
      qualifiers:
        reinsuranceBasis: NOT_APPLICABLE
        premiumBasis: NOT_APPLICABLE
        timeBasis: CALENDAR_YEAR
        accountingBasis: MANAGEMENT
      grain: "Month × product × sales channel"
      dimensions: ["Product", "Line of business", "Sales channel", "Payment frequency", "Customer segment"]
      components:
        - { role: NUMERATOR, metric: lapsed-policies-count }
        - { role: DENOMINATOR, metric: policies-in-force-count }
      refreshFrequency: MONTHLY
      example:
        lv: "13 700 spēku zaudējušas / 685 000 vidēji spēkā esošas = 2,0 % gadā"
        en: "13,700 lapsed / 685,000 average in force = 2.0% per year"
