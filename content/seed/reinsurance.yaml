  - slug: reinsurance-result
    type: METRIC
    labels:
      lv: { preferred: "Pārapdrošināšanas rezultāts", alt: ["Nodotās pārapdrošināšanas rezultāts", "Pārapdrošināšanas saldo"], abbrev: [] }
      en: { preferred: "Reinsurance result", alt: ["Result of reinsurance ceded", "Net reinsurance cost"], abbrev: [] }
    definition:
      lv: "Cedenta finanšu rezultāts no nodotās pārapdrošināšanas periodā: pārapdrošinātāju daļa radušos zaudējumos plus nopelnītā pārapdrošināšanas komisija, atskaitot pārapdrošinātājiem nodotās nopelnītās prēmijas."
      en: "The cedant's financial result from reinsurance ceded in the period: the reinsurers' share of claims incurred plus earned reinsurance commission, less ceded earned premium."
    notes:
      lv: "Ilgtermiņā rezultāts parasti ir negatīvs – tā ir aizsardzības cena; pozitīvs rezultāts parasti rodas gados ar lieliem vai katastrofāliem zaudējumiem, tāpēc rādītāja virziens ir neitrāls. Saskaņā ar 17. SFPS to uzrāda kā neto ienākumus vai izdevumus no turētajiem pārapdrošināšanas līgumiem, un no zaudējumiem neatkarīgā komisija samazina nodoto prēmiju."
      en: "Over the long term the result is usually negative, being the cost of protection; a positive result usually arises in years with large or catastrophe losses, so the polarity is neutral. Under IFRS 17 it is presented as net income or expense from reinsurance contracts held, and a commission not contingent on claims reduces the ceded premium."
    relations:
      - { type: RELATED, target: reinsurance-commission }
      - { type: RELATED, target: insurance-service-result }
      - { type: RELATED, target: net-loss-ratio }
    sources:
      - { title: "IFRS 17 Insurance Contracts", reference: "paragraph 86" }
    tags: [reinsurance, kpi, finance]
    metric:
      formula: "Reinsurance recoveries amount + Reinsurance commission (earned) − Ceded earned premium"
      unit: AMOUNT_EUR
      aggregation: SUM
      additivity: ADDITIVE
      polarity: NEUTRAL
      qualifiers:
        reinsuranceBasis: CEDED
        premiumBasis: EARNED
        timeBasis: CALENDAR_YEAR
        accountingBasis: MANAGEMENT
        inclusions:
          largeLosses: INCLUDED
          catastropheLosses: INCLUDED
          alae: INCLUDED
          ulae: EXCLUDED
          recoveries: INCLUDED
      grain: "Quarter × line of business × reinsurance treaty"
      dimensions: ["Line of business", "Reinsurance treaty", "Reinsurer", "Treaty type"]
      components:
        - { role: COMPONENT, metric: reinsurance-recoveries-amount }
        - { role: COMPONENT, metric: ceded-earned-premium }
      refreshFrequency: QUARTERLY
      example:
        lv: "Pārapdrošinātāju daļa zaudējumos 3,5 milj. EUR + komisija 1,5 milj. EUR − nodotās nopelnītās prēmijas 9,2 milj. EUR = −4,2 milj. EUR."
        en: "Reinsurers' share of claims EUR 3.5 m + commission EUR 1.5 m − ceded earned premium EUR 9.2 m = −EUR 4.2 m."
