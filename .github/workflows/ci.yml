name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vocab" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab_test
      TEST_DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab_test
      AUTH_SECRET: ci-only-secret
      AUTH_DEV_LOGIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Validate seed content
        run: npm run content:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrate and seed test database
        run: |
          npm run db:deploy
          npm run db:seed
      - name: Integration tests
        run: npm run test:db
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
